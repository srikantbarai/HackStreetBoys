<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="Student Activity Centre">
  <meta name="author" content="HackStreet Boys">
  <title>Sign In</title>
  <style>
    /* General body styling */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
        overflow: hidden;
    }

    .signin-container {
        position: relative;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        width: 350px;
        animation: popIn 1s ease-out;
    }

    @keyframes popIn {
        0% {
            transform: scale(0.8);
            opacity: 0;
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .signin-container h2 {
        margin-bottom: 25px;
        text-align: center;
        color: #333;
        font-size: 24px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .signin-button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(45deg, #1a73e8, #4285f4);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .signin-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .forgot-password,
    .signup-option {
        text-align: center;
        margin-top: 15px;
    }

    .forgot-password a,
    .signup-option a {
        color: #1a73e8;
        text-decoration: none;
    }

    .forgot-password a:hover,
    .signup-option a:hover {
        text-decoration: underline;
    }

    /* Background 3D Animation */
    .background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
    }

    .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        animation: float 15s ease-in-out infinite;
    }

    .circle:nth-child(1) {
        width: 200px;
        height: 200px;
        top: 20%;
        left: 10%;
        animation-duration: 10s;
        animation-delay: 0s;
    }

    .circle:nth-child(2) {
        width: 300px;
        height: 300px;
        top: 40%;
        left: 70%;
        animation-duration: 12s;
        animation-delay: 2s;
    }

    .circle:nth-child(3) {
        width: 150px;
        height: 150px;
        bottom: 10%;
        left: 30%;
        animation-duration: 8s;
        animation-delay: 4s;
    }

    .circle:nth-child(4) {
        width: 250px;
        height: 250px;
        bottom: 20%;
        right: 20%;
        animation-duration: 14s;
        animation-delay: 1s;
    }

    @keyframes float {
        0% {
            transform: translateY(0) rotate(0deg);
        }
        50% {
            transform: translateY(-20px) rotate(180deg);
        }
        100% {
            transform: translateY(0) rotate(360deg);
        }
    }
</style>

</head>
<body>
  <div class="signin-container">
    <h2>Sign In</h2>
    <form id="signin-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="signin-button">Sign In</button>
    </form>
    <div class="forgot-password">
      <a href="/reset-password">Forgot Password?</a>
    </div>
    <div class="signup-option">
      <p>Don't have an account? <a href="/signup">Sign Up</a></p>
    </div>
  </div>

  <script>
    // JavaScript to redirect after form submission
    document.getElementById('signin-form').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent default form submission
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (email && password) {
        // Redirect to the hostel allotment page
        window.location.href = "index.html";
      } else {
        alert("Please fill in all fields.");
      }
    });
  </script>
</body>
</html>
